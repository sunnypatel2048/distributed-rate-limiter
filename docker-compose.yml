# Two ways to use this file:
#   docker compose up -d redis      -> just Redis on localhost:6379 (for `dotnet run` and the tests)
#   docker compose up -d --build    -> the full cluster: nginx -> 3 app replicas -> 1 Redis,
#                                      plus Prometheus on http://localhost:9090
#
# The API is then on http://localhost:8080 (through nginx). The app replicas are
# deliberately NOT published to the host, so the only way in is through the proxy --
# which is also why it's safe for them to trust X-Forwarded-For from nginx.

x-app: &app
  build:
    context: .
    dockerfile: src/RateLimiter.Demo/Dockerfile
  image: ratelimiter-demo:local
  depends_on:
    redis:
      condition: service_healthy
  # "Healthy" = actually answering HTTP, not just "the container process started".
  # nginx waits for this on all three replicas (see below).
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/health"]
    interval: 2s
    timeout: 2s
    retries: 15
    start_period: 10s
  restart: unless-stopped
  networks:
    - ratelimiter
  environment: &app-env
    ASPNETCORE_ENVIRONMENT: Production
    ConnectionStrings__Redis: redis:6379
    # nginx's fixed address on the network below; the only proxy whose
    # X-Forwarded-For header the apps will believe.
    ReverseProxy__TrustedProxies__0: 172.28.0.10
    # One JSON object per log line, so fields like Policy and ClientId are queryable.
    Logging__Console__FormatterName: json
    Logging__Console__FormatterOptions__UseUtcTimestamp: "true"
    Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-ddTHH:mm:ss.fffZ"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ratelimiter

  app1:
    <<: *app
    hostname: app1
    environment:
      <<: *app-env
      InstanceName: app1

  app2:
    <<: *app
    hostname: app2
    environment:
      <<: *app-env
      InstanceName: app2

  app3:
    <<: *app
    hostname: app3
    environment:
      <<: *app-env
      InstanceName: app3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # Start taking traffic only once EVERY replica is ready. With a plain depends_on,
    # nginx starts as soon as the containers exist; early requests then hit replicas
    # that aren't listening yet, nginx benches each one, and for a moment it has no
    # replica left and answers 502 "no live upstreams".
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    restart: unless-stopped
    networks:
      ratelimiter:
        ipv4_address: 172.28.0.10

  # Scrapes /metrics from every replica every 5s: http://localhost:9090
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app1
      - app2
      - app3
    restart: unless-stopped
    networks:
      - ratelimiter

  # Load generator. Not started by `docker compose up` (it's in the "loadtest" profile).
  # Runs INSIDE the Docker network and hits nginx directly, which keeps Docker Desktop's
  # host port forwarding out of the latency numbers.
  #   docker compose run --rm k6
  #   docker compose run --rm -e RATE=1000 -e DURATION_SECONDS=60 k6
  k6:
    image: grafana/k6:1.0.0
    profiles: ["loadtest"]
    depends_on:
      - nginx
    networks:
      - ratelimiter
    volumes:
      - ./loadtest/k6:/scripts:ro
      - ./loadtest/results:/results
    environment:
      BASE_URL: http://nginx
      SUMMARY_PATH: /results/latest-summary.json
    command: ["run", "/scripts/benchmark.js"]

networks:
  ratelimiter:
    ipam:
      config:
        - subnet: 172.28.0.0/24
