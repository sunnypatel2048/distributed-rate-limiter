name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    # Includes the Testcontainers integration tests: GitHub's Ubuntu runners have Docker.
    - name: Test
      run: dotnet test --no-build --verbosity normal

  cluster:
    name: 3-replica cluster smoke test
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Start cluster (nginx -> 3 replicas -> Redis, plus Prometheus)
      run: docker compose up -d --build

    - name: Wait for the API to answer through nginx
      run: |
        for attempt in $(seq 1 60); do
          if curl -sf -o /dev/null http://localhost:8080/health; then
            echo "Cluster is up after ${attempt} attempt(s)."
            exit 0
          fi
          sleep 2
        done
        echo "Cluster did not become healthy in time." >&2
        exit 1

    # One client, 30 concurrent requests: passes only if exactly 10 were allowed
    # in total while the requests were spread across at least two replicas.
    - name: Verify one combined limit across replicas
      run: bash scripts/verify-cluster.sh

    - name: Verify /metrics is not reachable through nginx
      run: |
        status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/metrics)"
        echo "GET /metrics via nginx -> ${status}"
        test "${status}" = "404"

    - name: Verify replicas expose rate limiter metrics internally
      run: |
        # Captured first: piping into `grep -q` can fail under pipefail when grep exits early.
        metrics="$(docker compose exec -T nginx wget -qO- http://app1:8080/metrics)"
        if [[ "${metrics}" == *"ratelimiter_decisions_total"* ]]; then
          echo "app1 exposes ratelimiter_decisions_total"
        else
          echo "ratelimiter_decisions_total missing from app1 /metrics" >&2
          exit 1
        fi

    # Short, gentle run: CI runners are small and shared, so this checks that the
    # load test and its correctness thresholds pass, not how fast the runner is.
    - name: Load test smoke run (k6)
      run: docker compose run --rm -e RATE=200 -e DURATION_SECONDS=10 k6

    - name: Show container logs on failure
      if: failure()
      run: docker compose logs --no-color

    - name: Tear down
      if: always()
      run: docker compose --profile loadtest down -v
