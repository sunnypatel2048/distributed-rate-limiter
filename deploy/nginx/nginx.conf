worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Each log line shows which replica nginx picked: `docker compose logs -f nginx`.
    log_format upstream_log '$remote_addr "$request" $status -> $upstream_addr ($upstream_response_time s)';
    # Buffered, so logging every request doesn't become the bottleneck under load.
    access_log /dev/stdout upstream_log buffer=64k flush=1s;

    upstream ratelimiter_app {
        # Round robin by default: consecutive requests from the SAME client land on
        # different replicas. That's exactly the case a per-process counter gets wrong.
        # nginx's default benches a replica for 10s after a SINGLE failed attempt. One
        # blip on each replica (say, during a restart) would leave no replica at all.
        # Require 3 failures within 5s, and only bench for 5s.
        server app1:8080 max_fails=3 fail_timeout=5s;
        server app2:8080 max_fails=3 fail_timeout=5s;
        server app3:8080 max_fails=3 fail_timeout=5s;

        # Reuse upstream connections instead of opening one per request
        # (matters for the load test).
        keepalive 32;
    }

    server {
        listen 80;

        # Metrics are for Prometheus on the internal network, not the public.
        # Exact-match location wins over "location /".
        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://ratelimiter_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            # nginx is the edge, so OVERWRITE X-Forwarded-For with the address it actually
            # saw rather than appending to whatever the client sent.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Retry on another replica only for connection failures -- never for a 429,
            # or nginx would quietly turn one rejected request into several attempts.
            proxy_next_upstream error timeout;
        }
    }
}
