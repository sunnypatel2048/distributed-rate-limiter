worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Each log line shows which replica nginx picked: `docker compose logs -f nginx`.
    log_format upstream_log '$remote_addr "$request" $status -> $upstream_addr ($upstream_response_time s)';
    access_log /dev/stdout upstream_log;

    upstream ratelimiter_app {
        # Round robin by default: consecutive requests from the SAME client land on
        # different replicas. That's exactly the case a per-process counter gets wrong.
        server app1:8080;
        server app2:8080;
        server app3:8080;

        # Reuse upstream connections instead of opening one per request
        # (matters for the load test).
        keepalive 32;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://ratelimiter_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            # nginx is the edge, so OVERWRITE X-Forwarded-For with the address it actually
            # saw rather than appending to whatever the client sent.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Retry on another replica only for connection failures -- never for a 429,
            # or nginx would quietly turn one rejected request into several attempts.
            proxy_next_upstream error timeout;
        }
    }
}
